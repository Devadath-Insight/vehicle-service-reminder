# Used by automated tests only (activated with @ActiveProfiles("test")).
# Tests run against an in-memory H2 database, so MySQL is not required for "mvn clean install".
spring.datasource.url=jdbc:h2:mem:vsrs_test;MODE=MySQL;DATABASE_TO_LOWER=TRUE;DB_CLOSE_DELAY=-1;NON_KEYWORDS=YEAR,MONTH,DAY,VALUE,USER
spring.datasource.username=sa
spring.datasource.password=
spring.datasource.driver-class-name=org.h2.Driver
spring.jpa.hibernate.ddl-auto=create-drop
spring.jpa.show-sql=false
spring.thymeleaf.cache=true
