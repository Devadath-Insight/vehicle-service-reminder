# =====================================================================
#  Vehicle Service Reminder System - application configuration
# =====================================================================
spring.application.name=vehicle-service-reminder
server.port=8080

# ---------------------------------------------------------------------
#  MySQL connection
#  >>> ENTER YOUR MYSQL USERNAME / PASSWORD HERE <<<
#
#  Option A (recommended): set environment variables DB_USERNAME and
#           DB_PASSWORD (IntelliJ: Run > Edit Configurations >
#           Environment variables). Nothing secret goes into Git.
#  Option B (quick start): replace the text AFTER the colon, e.g.
#           ${DB_PASSWORD:MySecret123}
#           Do not commit a real password to source control.
# ---------------------------------------------------------------------
spring.datasource.url=${DB_URL:jdbc:mysql://localhost:3306/vehicle_service_db?useSSL=false&serverTimezone=UTC&allowPublicKeyRetrieval=true&createDatabaseIfNotExist=true}
spring.datasource.username=${DB_USERNAME:root}
spring.datasource.password=${DB_PASSWORD:}
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

# ---------------------------------------------------------------------
#  JPA / Hibernate
#  "update" keeps the tables created by database/database.sql and only
#  adds missing tables/columns. It never drops your data.
# ---------------------------------------------------------------------
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.format_sql=true
spring.jpa.open-in-view=true

# ---------------------------------------------------------------------
#  Thymeleaf (cache off so template edits show on refresh)
# ---------------------------------------------------------------------
spring.thymeleaf.cache=false
spring.thymeleaf.prefix=classpath:/templates/
spring.thymeleaf.suffix=.html

# ---------------------------------------------------------------------
#  Error handling - never show stack traces to users
# ---------------------------------------------------------------------
server.error.whitelabel.enabled=false
server.error.include-stacktrace=never
server.error.include-message=never
server.error.include-exception=false

# ---------------------------------------------------------------------
#  Sessions and security
# ---------------------------------------------------------------------
server.servlet.session.timeout=30m
server.servlet.session.cookie.http-only=true
app.security.remember-me-key=${REMEMBER_ME_KEY:vsrs-remember-me-key-change-in-production}

logging.level.com.vehicleservice=INFO
