<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">
<body>
<!-- Flash messages set by controllers with redirectAttributes.addFlashAttribute(...) -->
<div th:fragment="alerts" class="alerts-area">
    <div th:if="${successMessage}" class="alert alert-success alert-dismissible fade show" role="status" data-autodismiss>
        <i class="bi bi-check-circle-fill me-2"></i>
        <span th:text="${successMessage}">Saved.</span>
        <button type="button" class="btn-close" data-bs-dismiss="alert" aria-label="Close"></button>
    </div>
    <div th:if="${errorMessage}" class="alert alert-danger alert-dismissible fade show" role="alert">
        <i class="bi bi-exclamation-triangle-fill me-2"></i>
        <span th:text="${errorMessage}">Error.</span>
        <button type="button" class="btn-close" data-bs-dismiss="alert" aria-label="Close"></button>
    </div>
</div>
</body>
</html>
