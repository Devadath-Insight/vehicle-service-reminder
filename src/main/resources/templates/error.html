<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">
<!--
  Friendly error page. Used by GlobalExceptionHandler (errorTitle / errorMessage)
  and by Spring Boot's /error page (status / error). Never shows stack traces.
-->
<head th:replace="~{fragments/head :: head('Error')}"></head>
<body>
<main class="error-shell">
    <span class="plate plate-xl error-plate" th:text="${status != null} ? ${status} : '500'">404</span>
    <h1 th:text="${errorTitle != null} ? ${errorTitle} : (${error != null} ? ${error} : 'Something went wrong')">Page not found</h1>
    <p th:text="${errorMessage != null} ? ${errorMessage} : 'This page could not be displayed. Go back to the dashboard and try again.'">
        This page could not be displayed.
    </p>
    <div class="d-flex gap-2 flex-wrap justify-content-center">
        <a th:href="@{/dashboard}" class="btn btn-primary"><i class="bi bi-grid-1x2 me-1"></i>Go to dashboard</a>
        <a href="javascript:history.back()" class="btn btn-light">Go back</a>
    </div>
</main>
</body>
</html>
